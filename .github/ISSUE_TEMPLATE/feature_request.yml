name: Feature request
description: Suggest a recovery, analysis, reporting, or usability improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Read-only, privacy, and provenance considerations
      description: Explain any effects on input images, sensitive case data, network access, or evidence attribution.
