name: tests
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install forensic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sleuthkit testdisk e2fsprogs python3-venv python3-pil python3-libmsiecf python3-libesedb poppler-utils tesseract-ocr ffmpeg
      - name: Install crypto validation dependencies
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -e .
      - name: Check installed command
        run: .venv/bin/cold-digger --version
      - name: Run unit and real-image integration tests
        run: .venv/bin/python -m unittest discover -v
      - name: Build container
        run: docker build -t cold-digger:test .
      - name: Check container dependencies without networking
        run: docker run --rm --network none --read-only --tmpfs /tmp cold-digger:test doctor
